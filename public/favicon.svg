<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14161f" />
      <stop offset="100%" stop-color="#07080b" />
    </linearGradient>

    <!-- Top Block Facet (Gleam / Glass Reflection) -->
    <linearGradient id="topFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#a0a8b8" stop-opacity="0.6" />
    </linearGradient>

    <!-- Right Block Facet (Translucent Shadow) -->
    <linearGradient id="rightFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#707888" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#2a303c" stop-opacity="0.9" />
    </linearGradient>

    <!-- Left Block Facet (Deep Smoked Glass) -->
    <linearGradient id="leftFacet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a5262" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#181c24" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect 
    x="3" 
    y="3" 
    width="58" 
    height="58" 
    rx="16" 
    fill="url(#bgGrad)" 
    stroke="rgba(255, 255, 255, 0.16)" 
    stroke-width="1.5" 
  />

  <!-- Subtle Inner Ring Highlight -->
  <rect 
    x="5" 
    y="5" 
    width="54" 
    height="54" 
    rx="14" 
    fill="none" 
    stroke="rgba(255, 255, 255, 0.05)" 
    stroke-width="1" 
  />

  <!-- 3D Smoked Block Mark (Isometric LIFE OF BLOCKS) -->
  <g filter="url(#softGlow)" transform="translate(0, 1)">
    <!-- Top Isometric Face -->
    <path 
      d="M 32 15 L 47 23.5 L 32 32 L 17 23.5 Z" 
      fill="url(#topFacet)" 
      stroke="rgba(255, 255, 255, 0.4)" 
      stroke-width="0.8"
      stroke-linejoin="round"
    />

    <!-- Left Isometric Face -->
    <path 
      d="M 17 23.5 L 32 32 L 32 47 L 17 38.5 Z" 
      fill="url(#leftFacet)" 
      stroke="rgba(255, 255, 255, 0.15)" 
      stroke-width="0.8"
      stroke-linejoin="round"
    />

    <!-- Right Isometric Face -->
    <path 
      d="M 32 32 L 47 23.5 L 47 38.5 L 32 47 Z" 
      fill="url(#rightFacet)" 
      stroke="rgba(255, 255, 255, 0.2)" 
      stroke-width="0.8"
      stroke-linejoin="round"
    />

    <!-- Internal Core Floating Micro Block -->
    <path 
      d="M 32 24 L 38 27.5 L 32 31 L 26 27.5 Z" 
      fill="#ffffff" 
      opacity="0.9"
    />
  </g>
</svg>
