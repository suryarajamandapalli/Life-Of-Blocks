<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0f1f38"/>
      <stop offset="60%" stop-color="#070c17"/>
      <stop offset="100%" stop-color="#020409"/>
    </radialGradient>

    <!-- Glass Gradients -->
    <linearGradient id="glassTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.08"/>
    </linearGradient>

    <linearGradient id="glassMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="glassBottom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.15"/>
    </linearGradient>

    <linearGradient id="specularRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#bae6fd" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="glowG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>

    <filter id="spatialGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Base App Icon Tile -->
  <rect width="512" height="512" rx="118" fill="url(#bgGlow)"/>
  
  <!-- Subtle Inner Border of Icon -->
  <rect x="2" y="2" width="508" height="508" rx="116" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Cosmic Ambient Glow -->
  <ellipse cx="256" cy="240" rx="150" ry="110" fill="url(#glowG)" filter="url(#spatialGlow)"/>

  <!-- Spatial Glass Blocks Group -->
  <g transform="translate(256, 260) scale(1.15)">
    <!-- Base Layer Block (Isometric lower slab) -->
    <g filter="url(#softShadow)">
      <!-- Top Face -->
      <path d="M 0,-40 L 96,15 L 0,70 L -96,15 Z" fill="url(#glassBottom)" stroke="url(#specularRim)" stroke-width="1.8"/>
      <!-- Right Side Face -->
      <path d="M 96,15 L 96,45 L 0,100 L 0,70 Z" fill="#1e1b4b" fill-opacity="0.65" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <!-- Left Side Face -->
      <path d="M -96,15 L -96,45 L 0,100 L 0,70 Z" fill="#0f172a" fill-opacity="0.8" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    </g>

    <!-- Middle Floating Glass Block (Offset right) -->
    <g transform="translate(24, -45)" filter="url(#softShadow)">
      <!-- Top Face -->
      <path d="M 0,-32 L 68,7 L 0,46 L -68,7 Z" fill="url(#glassMid)" stroke="url(#specularRim)" stroke-width="2"/>
      <!-- Right Face -->
      <path d="M 68,7 L 68,32 L 0,71 L 0,46 Z" fill="#0369a1" fill-opacity="0.55" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <!-- Left Face -->
      <path d="M -68,7 L -68,32 L 0,71 L 0,46 Z" fill="#0c4a6e" fill-opacity="0.75" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    </g>

    <!-- Top Focal Glass Block (Elevated spatial jewel forming L/B core) -->
    <g transform="translate(-28, -90)" filter="url(#softShadow)">
      <!-- Top Face -->
      <path d="M 0,-36 L 64,0 L 0,36 L -64,0 Z" fill="url(#glassTop)" stroke="url(#specularRim)" stroke-width="2.5"/>
      <!-- Specular Highlight Sheen on Top Face -->
      <path d="M -60,0 L 0,-34 L 20,-22 L -40,12 Z" fill="#ffffff" fill-opacity="0.35"/>
      <!-- Right Face -->
      <path d="M 64,0 L 64,32 L 0,68 L 0,36 Z" fill="#0284c7" fill-opacity="0.45" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>
      <!-- Left Face -->
      <path d="M -64,0 L -64,32 L 0,68 L 0,36 Z" fill="#075985" fill-opacity="0.7" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>
    </g>

    <!-- Orbiting Spatial Star/Particle -->
    <circle cx="72" cy="-96" r="3.5" fill="#bae6fd" filter="url(#spatialGlow)"/>
    <circle cx="-85" cy="5" r="2.5" fill="#38bdf8" filter="url(#spatialGlow)"/>
    <circle cx="100" cy="40" r="2" fill="#c084fc" filter="url(#spatialGlow)"/>
  </g>
</svg>
